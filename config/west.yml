manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson/
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: geeksville
      url-base: https://github.com/geeksville
    - name: beekeeb
      url-base: https://github.com/beekeeb
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: cirque-input-module
      remote: geeksville
      # Pinned to the K_NO_WAIT fix (geeksville PR #4, open, 2026-07-04):
      # the driver reported input with K_FOREVER on the system workqueue,
      # so a congested split link filled the input queue and wedged the
      # peripheral's sysworkq forever (kscan/battery/split TX all stall,
      # firmware alive, no panic — the May/July right-half "goes dark"
      # mode). This commit's parent is our previous pin effec100f0cd
      # (late-Jan-2026 IRQ fixes), so it's a clean fast-forward that
      # keeps those. PR head, not on the toucan branch — pin the SHA.
      revision: 00a4a28604ff60d30492184262ed9fdf81def7a9
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
    - name: zmk-input-zoom
      remote: beekeeb
      # REL_MISC -> keypress input processor for the azoteq pinch-zoom
      # (zip_zoom_mapper in toucan.dtsi). Pinned SHA per repo rule
      # (= the repo's only commit as of 2026-08-20); proven on ZMK v0.3
      # by beekeeb's toucan2 config.
      revision: 91bbe0c0e02145da50c9df798489479d28be1804
  self:
    path: config
