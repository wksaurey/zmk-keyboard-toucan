CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# This is for 'regular' ZMK idle behavior.  Default is 30000 (30 seconds)
# This helps A LOT with touchpad power consumption (only 1.7mA idle vs 2.9mA active).  The only user visible aspect is
# that the touchpad needs 300ms to start seeing touches when next pressed - but this behavior is suppressed if we 
# have pressed a keyboard key within the last 30 seconds (highly likely).
CONFIG_ZMK_IDLE_TIMEOUT=30000

# We use this because we need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the cirque driver
# since we need all that might as well also turn on SOFT_OFF (which implies all these things but adds an optional SOFT_OFF feature)
CONFIG_ZMK_PM_SOFT_OFF=y

# Drop the BLE peripheral preferred slave-latency to 0 so the central
# (this half, talking to the host) stays awake for every connection
# interval instead of skipping ones to save battery. Cursor lag over
# BLE drops noticeably — trades battery life for trackpad responsiveness.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# ---- Split-central lockup fix (2026-07-04) ----
#
# Root cause of the "trackpad + right-half input dies until the LEFT
# half is power-cycled" lockup (captured live 2026-07-03/04, see
# HARDWARE_DEBUG.md): Zephyr's input thread runs a 512-byte default
# stack, and on the CENTRAL every forwarded trackpad event fans out
# through split_input_handler → listeners → zip_xy_scaler → mouse HID
# → scroll mapper — measured upstream at 536 bytes peak. The silent
# overflow corrupts adjacent memory, wedges the relay, and eventually
# kills the split link with BT_HCI_ERR_CONN_TIMEOUT (reason 0x08).
# Upstream fix: beekeeb/zmk-keyboard-toucan PR #19 (merged 2026-06-28,
# =2048). We use 4096 to match the peripheral-side bump style.
# NOTE: the May-2026 diagnostics added this bump to toucan_right.conf
# only — the wrong half; the fan-out runs here on the central.
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# Belt-and-suspenders: the central's split_central_split_run_q work
# queue (runs behavior invocations for every relayed event) also
# defaults to 512 bytes; beekeeb PR #20 (closed unmerged, measurements
# disputed) saw it down to 4 bytes free under sustained relay load.
# ~3.5 KB RAM for insurance on the same failure class.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=4096

# Turn a silent stack overflow into a detectable panic instead of a
# mystery wedge. No console on this half (build entry carries the
# studio-rpc-usb-uart snippet, not zmk-usb-logging), so no thread
# analyzer here — a sentinel trip shows up as the half hard-halting
# (local keys die too) instead of the relay-only wedge, which is
# distinguishable from the outside. THREAD_NAME is free and labels
# threads if we ever do attach a console (swap the snippet).
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
