CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Azoteq TPS43 is I2C (vendored driver in drivers/input/, K_NO_WAIT-patched
# — see drivers/README.md). INPUT_TPS43 defaults y once the DT node + I2C
# are enabled, but keep it explicit.
CONFIG_I2C=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_BATTERY_REPORTING=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# 60 min before deep sleep (BLE reconnect on wake) — same reasoning as the
# cirque build.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Regular ZMK idle at the 30s default (beekeeb toucan2 value). The cirque
# build runs 0 for lockup-diag reasons specific to the cirque's sleep/wake
# races; the azoteq driver's power management is its own on-chip LP state
# machine (enable-power-management in the overlay), so start at the default
# and revisit only if the trial implicates it.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Stack headroom — PERMANENT mitigation carried over from the cirque
# lockup work (toucan_right.conf); multitouch gesture traffic is heavier
# than the cirque's, so keep 4096 (beekeeb ships 2048).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# The vendored driver LOG_INFs on the hot path ("Sending movement" per
# report, ~100 msg/s during cursor use). With zmk-usb-logging (CONFIG_LOG)
# on this build that burns peripheral CPU/power and floods the same
# deferred-log path the thread-analyzer heartbeat and split-disconnect
# line ride on (deferred logging silently drops under flood — see
# toucan_right.conf). WRN keeps every LOG_ERR/LOG_WRN.
CONFIG_INPUT_LOG_LEVEL_WRN=y

# ---- Trial instrumentation (mirrors the cirque diag block) ----
# The AZOTEQ_UPGRADE.md trial protocol reuses the USB capture rig
# (C:\Temp\toucan-logger-watchdog.ps1) unchanged: the zmk-usb-logging
# snippet on this build entry provides the CDC console; the analyzer
# heartbeat below is what distinguishes "firmware alive, BLE link dead"
# from a real wedge (see toucan_right.conf history for why each is here).
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_NAME=y
# Do NOT add CONFIG_BT_*_LOG_LEVEL_DBG here — bricks the boot (see the
# 2026-06-16 note in toucan_right.conf).
