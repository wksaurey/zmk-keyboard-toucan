CONFIG_ZMK_POINTING=y

# The pinnacle driver also requires this to include sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Required to include the touchpad autosleep code.  This saves *lots* of power during use
# but IMO the user experience feels not so great because quite often when you go to use the touchpad
# you need to wait ~300ms for it to wake up.  So for now I'm leaving it off.  I think with just my 
# shutdown mode power savings are probably adequate
# CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Was CONFIG_ZMK_IDLE_TIMEOUT=30000 — the cirque chip would idle after
# 30s of no keypress, with a 300ms wake-up delay on next touch. Disabled
# (=0) on 2026-05-11 while investigating frequent peripheral lockups
# during plain cursor use (every 6-8 min). Eliminates the chip's
# sleep/wake races as a suspect. Costs ~1.2 mA extra current draw during
# idle; re-enable if the lockup is unrelated.
CONFIG_ZMK_IDLE_TIMEOUT=0

# We use this because we need ZMK_PM, PM_DEVICE and ZMK_PM_DEVICE_SUSPEND_RESUME to get proper sleep notifications into the cirque driver
# since we need all that might as well also turn on SOFT_OFF (which implies all these things but adds an optional SOFT_OFF feature)
CONFIG_ZMK_PM_SOFT_OFF=y

# Stack-size headroom in case the cirque driver's hot path is hitting
# default-size stack pressure under continuous trackpad load. Cheap
# RAM cost; helps rule stack overflow out as a lockup cause.
# PERMANENT mitigation (kept regardless of diag block below).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# ---- Diag block (revert when root cause is found) ----
#
# 2026-05-27: right half failed at 12:53:00 during cursor use, battery
# ~50% (rules out brown-out). Matches the "right-half lockup during
# continuous trackpad use" symptom documented in HARDWARE_DEBUG.md.
#
# First-pass plan (WDT + stack sentinel) failed CI: CONFIG_WDT doesn't
# exist (parent is CONFIG_WATCHDOG), and CONFIG_ZMK_BEHAVIORS_WATCHDOG
# isn't in this ZMK. Even with names fixed, the watchdog is dormant
# without a kicker — ZMK doesn't ship one. Decision: drop recovery,
# focus on diagnosis. Picking watchdog vs. other recovery options
# becomes a real question once we know what's actually failing.
#
# USB CDC console is wired up via the `zmk-usb-logging` snippet on
# this build entry in build.yaml — that handles the DTS chosen-node
# redirect (zephyr,console → cdc_acm uart) AND the Kconfig selects
# (USB_DEVICE_STACK, USB_CDC_ACM, USB_UART_CONSOLE, UART_LINE_CTRL,
# LOG, etc.). Raw symbols alone don't reroute the console.
#
# Heisenbug caveat: always-on USB on a BLE peripheral changes
# scheduler load, ISR cadence, and idle/sleep behavior. If the
# lockup *stops* reproducing under diag firmware, that's itself a
# data point — suspect a sleep or timing-sensitive path.

# Stack overflow detection. If the cirque hot path is overflowing,
# this turns a silent deadlock into a kernel panic with a traceback
# that the USB CDC console can print. Without the console (i.e.
# without the snippet on this build entry), a sentinel halt is
# indistinguishable from a hang.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y

# Thread analyzer — name the stuck thread on a SILENT hang.
# 2026-05-28: right half hung at ~21:49 (uptime 00:04:47), ~5 min
# after a post-dinner power-on. USB CDC capture showed normal log
# lines (battery 4005 mV / 75%, split listener) then dead silence —
# NO panic, NO ZEPHYR FATAL ERROR. With STACK_SENTINEL active that
# rules stack overflow OUT (a sentinel trip would have paniced).
# Not a BLE-link drop either: the console produced nothing live after
# connect, so the firmware itself halted. That leaves a silent hang
# (mutex deadlock / ISR storm / SPI-to-cirque stuck) which the panic
# path can't catch.
#
# *** SUPERSEDED 2026-06-04 (see dated block below) ***  The "firmware
# halted" / "not a BLE drop" reads here were WRONG, and the reason is
# instructive: THREAD_ANALYZER_AUTO was first added in *this* same commit,
# so on 05-28 there was no periodic heartbeat to watch — "dead silence
# after connect" only meant nothing was being printed between events, not
# that the kernel had stopped. The 06-04 capture (analyzer ticking for 4+
# min during an identical hang) shows the firmware stays ALIVE and the
# dead segment is the split BLE link. Classic absence-isn't-evidence: the
# instrument couldn't see liveness yet, so absence got read as a halt.
#
# AUTO dumps every thread's state + stack high-water mark on a timer.
# The LAST dump before the freeze names whichever thread stopped
# advancing — mode-agnostic (doesn't presume the trackpad; Kolter was
# likely typing, not on the cursor, when it hung).
#
# USE_PRINTK (synchronous) on purpose, not USE_LOG: printk goes
# straight to the console UART instead of the deferred log ringbuf,
# so the dump survives even if the log thread is the one that's stuck.
# 5 s interval keeps the last dump <=5 s stale at freeze without
# flooding the small ringbuf (LOG_BUFFER_SIZE=8192 / CDC ringbuf 1024)
# or perturbing scheduler timing more than necessary (heisenbug risk).
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_ANALYZER_USE_PRINTK=y

# ---- 2026-06-04: caught the lockup LIVE over the USB console. ----
# The right half hung (keys + trackpad dead to the host, no layer change
# reaching the left/central half) while the thread-analyzer dump kept
# advancing for 4+ minutes: idle thread + several others ticking up, no
# panic, no STACK_SENTINEL trip, all stacks stable. The firmware core was
# ALIVE the whole time. That rules out a firmware crash / stack overflow /
# cirque-SPI-only hang and points at the right<->left split BLE link as the
# dead segment ("Firmware alive, BLE link dropped" in HARDWARE_DEBUG.md).
# It did NOT self-recover (no power cycle, never came back). The additions
# below are to identify WHICH part of the BLE side fails on the NEXT capture:
# (1) name the threads, (2) log the disconnect reason from hci_core + conn.

# Name the threads in the analyzer dump. Today's dump labeled every thread
# with a raw address (e.g. 0x20004540), so the BLE/split thread couldn't be
# picked out. NOTE there isn't one tidy "BT thread" — expect several
# (`BT RX WQ`, the TX thread, ZMK's split listener); the LL/controller may
# not show as a normal analyzable thread at all.
#
# Reading the counters (they are CPU cycles, i.e. work done — NOT a liveness
# tick), once the threads are named:
#   - counter advancing  => that thread is actively running (e.g. spinning)
#   - counter frozen      => AMBIGUOUS on its own: could be (a) correctly
#                            parked on a semaphore waiting for events — the
#                            NORMAL, healthy state for an idle/dead link — or
#                            (b) genuinely stuck holding a lock (a fw bug).
# So "frozen BT thread" is a lead, not a verdict: a parked BLE thread looks
# identical to a wedged one in the cycle count. Pair it with the disconnect
# reason (below) and the thread's state column to disambiguate.
# Kept (cheap: small RAM, no behavior change) but part of the diag effort.
CONFIG_THREAD_NAME=y

# REMOVED 2026-06-16: CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG and
# CONFIG_BT_CONN_LOG_LEVEL_DBG were tried here (2026-06-04, c205b8c) to print
# the disconnect REASON byte, but the BT host's debug-log flood at init BRICKS
# the right half's boot — USB never enumerates ("device descriptor request
# failed"), no split link, recoverable only via double-tap DFU. See
# HARDWARE_DEBUG.md, STATUS 2026-06-09. They were also redundant: ZMK's split
# peripheral already logs `Disconnected from <addr> (reason 0x..)` at `zmk` DBG
# level on the current firmware (enabled by the zmk-usb-logging snippet), so the
# reason byte is already captured if the USB console is attached BEFORE the
# drop — no rebuild and no BT debug flags needed.
#
# Do NOT re-add these. Escalation if the reason line ever fails to surface:
# first raise CONFIG_LOG_BUFFER_SIZE above the 8192 default (deferred logging
# silently drops messages under flood — the disconnect line is a candidate)
# before reaching for any blanket BT DBG logging.
